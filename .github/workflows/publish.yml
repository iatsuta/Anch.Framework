name: Publish to Nuget

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - uses: actions/checkout@v5

      - name: Set up node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: ./src/SecuritySystem/Anch.SecuritySystem.Configurator/configurator-ui

      - name: Build UI
        working-directory: ./src/SecuritySystem/Anch.SecuritySystem.Configurator/configurator-ui
        run: |
          npm ci
          npm run ng build

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Restore dependencies
        run: |
          dotnet restore src/Anch.Framework.slnx

      - name: Build and Pack
        working-directory: ./src
        run: |
          dotnet pack Anch.Framework.slnx --no-restore /p:PackageVersion=${{ github.event.release.tag_name }} /p:InformationalVersion=${{ github.sha }} -c Release -o out

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish
        working-directory: ./src/out
        run: |
          dotnet nuget push *.nupkg -s https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN} --skip-duplicate
        env:
          NUGET_TOKEN: ${{ steps.login.outputs.NUGET_API_KEY }}
